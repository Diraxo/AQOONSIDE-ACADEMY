<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=aq1" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=aq1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="AQOONSIDE SCHOOL — School Management System" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=aq1" />
    <script>
      // Apply the saved/system appearance before first paint (no white flash). Mirrors src/utils/theme.js.
      (function () {
        try {
          var m = localStorage.getItem("aqoonside-theme");
          var dark = m === "dark" || ((m !== "light") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.classList.add("dark");
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>AQOONSIDE SCHOOL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
